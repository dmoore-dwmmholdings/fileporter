<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #74e6a0; } a:hover { color: #a8f5c6; }
    .q * { box-sizing: border-box; }
    .q button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }

    .q-stage { position: relative; display: block; width: 100%; height: 100%; padding: 0; text-align: left; }
    .q-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 240px; pointer-events: none;
      background: radial-gradient(60% 100% at 50% 118%, rgba(120,230,160,.16), transparent 70%); }

    .beam { position: absolute; left: 50%; top: 150px; bottom: 221px; pointer-events: none;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 28%, #000 72%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 28%, #000 72%, transparent); }
    .beam-o { width: 340px; margin-left: -170px; opacity: .3; filter: blur(22px);
      background: linear-gradient(180deg, rgba(120,230,160,0), rgba(120,230,160,.4)); }
    .beam-m { width: 150px; margin-left: -75px; opacity: .3; overflow: hidden;
      background: linear-gradient(180deg, rgba(120,230,160,0), rgba(120,230,160,.26)); }
    .beam-m::after { content: ''; position: absolute; inset: -30px 0;
      background: repeating-linear-gradient(180deg, rgba(190,255,215,.07) 0 1.5px, transparent 1.5px 26px);
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 55%);
      mask-image: linear-gradient(180deg, transparent, #000 55%);
      animation: flow 3.1s linear infinite; }
    @keyframes flow { to { transform: translateY(27.5px); } }
    .q-stage:hover .beam-o { opacity: .46; } .q-stage:hover .beam-m { opacity: .46; }
    .q-stage:hover .beam-m::after { animation-duration: 1.3s; }

    .pad-seg { opacity: .16; }
    .pad-segs .s0 { animation: seg 2.2s steps(1,end) infinite; }
    .pad-segs .s1 { animation: seg 2.2s steps(1,end) infinite .28s; }
    .pad-segs .s2 { animation: seg 2.2s steps(1,end) infinite .56s; }
    .pad-segs .s3 { animation: seg 2.2s steps(1,end) infinite .84s; }
    .pad-segs .s4 { animation: seg 2.2s steps(1,end) infinite 1.12s; }
    .pad-segs .s5 { animation: seg 2.2s steps(1,end) infinite 1.4s; }
    .pad-segs .s6 { animation: seg 2.2s steps(1,end) infinite 1.68s; }
    .pad-segs .s7 { animation: seg 2.2s steps(1,end) infinite 1.96s; }
    @keyframes seg { 0% { opacity: .8; } 22%, 100% { opacity: .14; } }
    .pad-node { animation: blink 1.6s steps(1,end) infinite; }
    .pad-node.n1 { animation-delay: .2s; } .pad-node.n2 { animation-delay: .4s; }
    .pad-node.n3 { animation-delay: .6s; } .pad-node.n4 { animation-delay: .8s; }
    .pad-node.n5 { animation-delay: 1s; } .pad-node.n6 { animation-delay: 1.2s; }
    .pad-node.n7 { animation-delay: 1.4s; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .pad-core { animation: breathe 3.9s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: .85; } }
    .q-stage:hover .pad-core { animation-duration: 1.5s; }
    .pad-haze { opacity: .6; }

    .nav { position: relative; font-size: 13px; color: #7f9689; padding-bottom: 3px; transition: color 160ms; }
    .nav:hover { color: #d6e5db; }
    .nav.on { color: #eaf6ef; }
    .nav.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--acc, #74e6a0); }

    .chip { transition: color 160ms, box-shadow 160ms; }
    .chip:hover { box-shadow: inset 0 0 0 1px rgba(120,230,160,.5); }
    .row { transition: opacity 160ms; }
    .act { opacity: .4; transition: opacity 160ms; }
    .row:hover .act { opacity: 1; }
    .row { display: flex; align-items: center; gap: 10px; }
    .fade { animation: fade 600ms ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .pkt { position: absolute; left: 50%; width: 250px; margin-left: -125px;
      display: flex; align-items: center; gap: 9px; padding: 8px 12px; background: #0c1712;
      box-shadow: inset 0 0 0 1px rgba(120,230,160,.3), 0 8px 22px rgba(0,0,0,.55);
      font-size: 12px; transition: transform 200ms ease; }
    .q-stage:hover .pkt { transform: translateY(-6px); }
    .ph-go .pkt { animation: lift 900ms ease-in forwards; }
    .ph-go .p2 { animation-delay: 110ms; } .ph-go .p3 { animation-delay: 220ms; }
    @keyframes lift { to { transform: translateY(-230px) scaleX(.5); opacity: 0; filter: blur(3px); } }
    .ph-done .pkt { opacity: 0; }
    .ph-go .beam-o { opacity: .6; } .ph-go .beam-m { opacity: .62; }
    .ph-go .beam-m::after { animation-duration: .34s; }
    .ph-go .pad-core, .ph-done .pad-core { animation-duration: .5s; }

    .drag .beam-o { opacity: .62; } .drag .beam-m { opacity: .6; }
    .drag .beam-m::after { animation-duration: 1s; }
    .drag .pad-core { animation-duration: 1s; }
    .drag .pkt { transform: translateY(-10px); }
    .drag h1 { text-shadow: 0 0 30px rgba(190,255,215,.5), 0 0 70px rgba(120,230,160,.3); }
    .drag .q-floor { opacity: 1; }
    .q-floor { opacity: .75; transition: opacity 220ms ease; }

    .ring { position: absolute; left: 50%; bottom: 142px; width: 620px; height: 132px; margin-left: -310px;
      border-radius: 50%; box-shadow: 0 0 0 1px var(--acc, #74e6a0); opacity: 0; }
    .ph-done .ring { animation: ring 1s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes ring { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.12); opacity: 0; } }
  </style>
</helmet>

<div class="q ph-{{phase}} {{dragClass}}" style="width: 1120px; height: 760px; position: relative; overflow: hidden; background: #0a100d; color: #eaf6ef; font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; --acc: {{accent}}">

  <header style="position: absolute; left: 0; right: 0; top: 0; z-index: 4; display: flex; align-items: center; gap: 26px; padding: 22px 28px">
    <span style="display: flex; align-items: center; gap: 9px">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="{{accent}}" stroke-width="1.2">
        <ellipse cx="10" cy="15" rx="8" ry="3"></ellipse><path d="M10 12V2m0 0L6.5 5.5M10 2l3.5 3.5"></path>
      </svg>
      <span style="font-size: 13px; font-weight: 500; letter-spacing: -.01em; color: #eaf6ef">Fileporter</span>
    </span>
    <nav style="display: flex; gap: 20px">
      <button class="nav on" type="button">Transport</button>
      <button class="nav" type="button">Pads</button>
      <button class="nav" type="button">Log</button>
      <button class="nav" type="button">Config</button>
    </nav>
    <div style="flex-grow: 1"></div>
    <span style="display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: #8aa398">
      Workshop iMac
      <span style="width: 1px; height: 11px; background: rgba(120,230,160,.24)"></span>
      <span style="width: 5px; height: 5px; border-radius: 50%; background: {{accent}}"></span>{{statusLine}}
    </span>
  </header>

  <button class="q-stage" type="button" onClick="{{send}}" onDragEnter="{{dragOn}}" onDragOver="{{dragOver}}" onDragLeave="{{dragOff}}" onDrop="{{drop}}">
    <span class="q-floor"></span>
    <span class="beam beam-o"></span>
    <span class="beam beam-m"></span>

    <span class="fade" style="position: absolute; left: 0; right: 0; top: 104px; display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none">
      <h1 style="margin: 0; font-size: 44px; font-weight: 300; letter-spacing: -.032em; color: #eaf6ef">{{title}}</h1>
      <p style="margin: 0; font-size: 14.5px; font-weight: 300; color: #8aa398">{{sub}}</p>
    </span>

    <span style="position: absolute; left: 0; right: 0; top: 214px; display: flex; justify-content: center; gap: 8px">
      <sc-for list="{{devices}}" as="d" hint-placeholder-count="3">
        <span class="chip" style="{{d.style}}" onClick="{{d.pick}}">{{d.name}}</span>
      </sc-for>
    </span>

    <span class="pkt p1" style="top: 350px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"></path></svg>
      <span class="mono" style="flex-grow: 1">Q3-review.pdf</span><span class="mono" style="color: #8aa398">4.2 MB</span></span>
    <span class="pkt p2" style="top: 388px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span class="mono" style="flex-grow: 1">shoot-raws</span><span class="mono" style="color: #8aa398">312</span></span>
    <span class="pkt p3" style="top: 426px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"></rect><path d="m3 15 5-5 4 4 3-3 6 6"></path></svg>
      <span class="mono" style="flex-grow: 1">site-hero.png</span><span class="mono" style="color: #8aa398">2.1 MB</span></span>

    <span class="ring"></span>
    <svg viewBox="0 0 700 190" preserveAspectRatio="xMidYMid meet" style="position: absolute; left: 50%; bottom: 130px; width: 680px; margin-left: -340px; height: 184px"><defs><linearGradient id="deck2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="{{accent}}" stop-opacity=".30"/><stop offset="52%" stop-color="{{accent}}" stop-opacity=".10"/><stop offset="100%" stop-color="{{accent}}" stop-opacity=".035"/></linearGradient><linearGradient id="rim2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="{{accent}}" stop-opacity=".46"/><stop offset="100%" stop-color="{{accent}}" stop-opacity=".06"/></linearGradient><radialGradient id="core2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e8fff2" stop-opacity=".92"/><stop offset="22%" stop-color="{{accent}}" stop-opacity=".58"/><stop offset="100%" stop-color="{{accent}}" stop-opacity="0"/></radialGradient></defs><path d="M18 96 A332 68 0 0 0 682 96 L682 124 A332 68 0 0 1 18 124 Z" fill="url(#rim2)"/><path d="M18.0 96.0 L18.0 124.0 M20.1 88.4 L20.1 116.4 M26.3 80.9 L26.3 108.9 M36.6 73.5 L36.6 101.5 M50.9 66.5 L50.9 94.5 M68.9 59.8 L68.9 87.8 M90.5 53.6 L90.5 81.6 M115.3 47.9 L115.3 75.9 M143.1 42.8 L143.1 70.8 M173.4 38.4 L173.4 66.4 M206.0 34.7 L206.0 62.7 M240.4 31.8 L240.4 59.8 M276.2 29.7 L276.2 57.7 M312.9 28.4 L312.9 56.4 M350.1 28.0 L350.1 56.0 M387.3 28.4 L387.3 56.4 M424.0 29.7 L424.0 57.7 M459.8 31.8 L459.8 59.8 M494.2 34.7 L494.2 62.7 M526.8 38.4 L526.8 66.4 M557.1 42.9 L557.1 70.9 M584.9 47.9 L584.9 75.9 M609.7 53.6 L609.7 81.6 M631.2 59.9 L631.2 87.9 M649.2 66.5 L649.2 94.5 M663.4 73.6 L663.4 101.6 M673.7 80.9 L673.7 108.9 M679.9 88.4 L679.9 116.4 M682.0 96.0 L682.0 124.0" stroke="{{accent}}" stroke-width=".9" opacity=".26" fill="none"/><path d="M18 96 A332 68 0 0 0 682 96" fill="none" stroke="{{accent}}" stroke-width="2" opacity="1"/><path d="M18 124 A332 68 0 0 0 682 124" fill="none" stroke="{{accent}}" stroke-width="1.1" opacity=".34"/><ellipse cx="350" cy="96" rx="332" ry="68" fill="url(#deck2)"/><path d="M672.0 96.0 L500.0 96.0 M647.5 121.3 L488.6 107.9 M577.7 142.7 L456.1 117.9 M473.2 157.0 L407.4 124.6 M350.0 162.0 L350.0 127.0 M226.8 157.0 L292.6 124.6 M122.3 142.7 L243.9 117.9 M52.5 121.3 L211.4 107.9 M28.0 96.0 L200.0 96.0 M52.5 70.7 L211.4 84.1 M122.3 49.3 L243.9 74.1 M226.8 35.0 L292.6 67.4 M350.0 30.0 L350.0 65.0 M473.2 35.0 L407.4 67.4 M577.7 49.3 L456.1 74.1 M647.5 70.7 L488.6 84.1" stroke="{{accent}}" stroke-width="1" opacity=".14" fill="none"/><path class="pad-seg s0" d="M663.7 98.7 A314 64 0 0 1 644.9 118.0" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s1" d="M634.8 122.9 A314 64 0 0 1 581.1 139.3" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s2" d="M562.5 143.1 A314 64 0 0 1 482.2 154.1" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s3" d="M457.9 156.1 A314 64 0 0 1 363.1 159.9" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s4" d="M336.9 159.9 A314 64 0 0 1 242.1 156.1" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s5" d="M217.8 154.1 A314 64 0 0 1 137.5 143.1" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s6" d="M118.9 139.3 A314 64 0 0 1 65.2 122.9" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s7" d="M55.1 118.0 A314 64 0 0 1 36.3 98.7" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s0" d="M36.3 93.3 A314 64 0 0 1 55.1 74.0" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s1" d="M65.2 69.1 A314 64 0 0 1 118.9 52.7" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s2" d="M137.5 48.9 A314 64 0 0 1 217.8 37.9" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s3" d="M242.1 35.9 A314 64 0 0 1 336.9 32.1" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s4" d="M363.1 32.1 A314 64 0 0 1 457.9 35.9" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s5" d="M482.2 37.9 A314 64 0 0 1 562.5 48.9" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s6" d="M581.1 52.7 A314 64 0 0 1 634.8 69.1" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s7" d="M644.9 74.0 A314 64 0 0 1 663.7 93.3" fill="none" stroke="{{accent}}" stroke-width="1.8"/><ellipse cx="350" cy="96" rx="322" ry="66" fill="none" stroke="{{accent}}" stroke-width="1" opacity="0.42"/><ellipse cx="350" cy="96" rx="262" ry="54" fill="none" stroke="{{accent}}" stroke-width="1" opacity="0.17"/><ellipse cx="350" cy="96" rx="206" ry="42" fill="none" stroke="{{accent}}" stroke-width="1" opacity="0.15"/><ellipse cx="350" cy="96" rx="150" ry="31" fill="none" stroke="{{accent}}" stroke-width="1" opacity="0.34"/><ellipse class="pad-core" cx="350" cy="96" rx="150" ry="31" fill="url(#core2)"/><ellipse cx="350" cy="96" rx="150" ry="31" fill="none" stroke="{{accent}}" stroke-width="1.5" opacity=".9"/><rect x="649.2" y="117.0" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n0" cx="656.7" cy="122.0" r="2.3" fill="{{accent}}"/><rect x="469.6" y="153.8" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n1" cx="477.1" cy="158.8" r="2.3" fill="{{accent}}"/><rect x="215.4" y="153.8" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n2" cx="222.9" cy="158.8" r="2.3" fill="{{accent}}"/><rect x="35.8" y="117.0" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n3" cx="43.3" cy="122.0" r="2.3" fill="{{accent}}"/><rect x="35.8" y="65.0" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n4" cx="43.3" cy="70.0" r="2.3" fill="{{accent}}"/><rect x="215.4" y="28.2" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n5" cx="222.9" cy="33.2" r="2.3" fill="{{accent}}"/><rect x="469.6" y="28.2" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n6" cx="477.1" cy="33.2" r="2.3" fill="{{accent}}"/><rect x="649.2" y="65.0" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n7" cx="656.7" cy="70.0" r="2.3" fill="{{accent}}"/></svg>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; align-items: center; gap: 14px; padding: 0 28px 30px">
    <sc-for list="{{arrivals}}" as="a" hint-placeholder-count="2">
      <span class="row" style="display: flex; align-items: center; gap: 10px">
        <span class="mono" style="font-size: 12px; color: #b3c9bd">{{a.name}}</span>
        <span class="mono" style="font-size: 11px; color: #8aa398">{{a.size}}</span>
        <span class="act" style="display: flex; gap: 6px">
          <span class="chip mono" style="padding: 3px 9px; font-size: 10.5px; color: #8aa398; box-shadow: inset 0 0 0 1px rgba(120,230,160,.22)">COPY</span>
          <span class="chip mono" style="padding: 3px 9px; font-size: 10.5px; color: #8aa398; box-shadow: inset 0 0 0 1px rgba(120,230,160,.22)">CUT</span>
        </span>
      </span>
    </sc-for>
    <div style="flex-grow: 1"></div>
    <span style="font-size: 12px; color: #8aa398">{{footer}}</span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#74e6a0","options":["#74e6a0","#5ddc8f","#9cf5bd","#3fcf7c"]},"$preview":{"width":1120,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: ['mbp', 'studio'], phase: 'idle', drag: false };
    this.timers = [];
  }
  componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); }
  toggle(id) {
    const picked = this.state.picked.includes(id)
      ? this.state.picked.filter((v) => v !== id)
      : this.state.picked.concat([id]);
    this.setState({ picked: picked });
  }
  setDrag(v) { if (this.state.drag !== v) this.setState({ drag: v }); }
  send() {
    if (this.state.phase !== 'idle' || this.state.picked.length === 0) return;
    this.setState({ phase: 'go' });
    this.timers.push(setTimeout(() => this.setState({ phase: 'done' }), 1500));
    this.timers.push(setTimeout(() => this.setState({ phase: 'idle' }), 3400));
  }
  renderVals() {
    const acc = this.props.accent ?? '#74e6a0';
    const raw = [
      { id: 'mbp', name: 'MacBook Pro', online: true },
      { id: 'studio', name: 'Studio', online: true },
      { id: 'thinkpad', name: 'ThinkPad', online: false }
    ];
    const phase = this.state.phase;
    const count = this.state.picked.length;
    return {
      accent: acc,
      phase: phase,
      dragClass: this.state.drag ? 'drag' : '',
      dragOn: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setDrag(true); },
      dragOver: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setDrag(true); },
      dragOff: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setDrag(false); },
      drop: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setDrag(false); this.send(); },
      devices: raw.map((d) => {
        const sel = this.state.picked.includes(d.id);
        return {
          name: d.name,
          pick: () => this.toggle(d.id),
          style: 'padding: 6px 14px; border-radius: 999px; font-size: 12.5px; '
            + (sel ? 'color: #071008; background: ' + acc + ';'
                   : 'color: #8aa398; box-shadow: inset 0 0 0 1px rgba(120,230,160,.2);')
        };
      }),
      title: this.state.drag && phase === 'idle' ? 'Let go.' : phase === 'go' ? 'Going.' : phase === 'done' ? 'Landed.' : 'Drop anything.',
      sub: this.state.drag && phase === 'idle'
        ? 'Release and it goes to ' + count + ' pad' + (count === 1 ? '' : 's')
        : phase === 'go'
        ? 'On the beam to ' + count + ' pad' + (count === 1 ? '' : 's')
        : phase === 'done'
          ? 'Every pad returned a matching digest'
          : count === 0 ? 'Pick a pad below' : 'It reassembles on ' + count + ' pad' + (count === 1 ? '' : 's'),
      statusLine: phase === 'go' ? '84.2 MB/s' : count + ' of 3 linked',
      arrivals: [
        { name: 'field-notes.md', size: '38 KB' },
        { name: 'render-out/', size: '11.8 GB' }
      ],
      footer: 'Encrypted · verified · never leaves this network',
      send: () => this.send()
    };
  }
}
</script>
</body>
</html>
