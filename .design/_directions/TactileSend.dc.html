<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Outfit:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #17915c; } a:hover { color: #0e6f45; }
    .ta * { box-sizing: border-box; }
    .ta button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .ta input { font: inherit; color: inherit; }

    .ta-blob { position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none; }

    .ta-nav b { position: relative; }
    .ta-pill { transition: transform 200ms cubic-bezier(.34,1.56,.64,1), background 180ms, box-shadow 180ms; }
    .ta-pill:hover { transform: translateY(-2px); }
    .ta-pill:active { transform: translateY(0) scale(.97); }

    /* the chute */
    .ta-chute { position: relative; transition: transform 260ms cubic-bezier(.34,1.56,.64,1), box-shadow 260ms ease; }
    .ta-chute:hover { transform: translateY(-3px);
      box-shadow: 0 30px 60px -18px rgba(16,86,55,.28), 0 3px 0 #cfeadd, inset 0 2px 0 rgba(255,255,255,.9); }
    .ta-chute:active { transform: translateY(0) scale(.995); }

    .ta-slot { position: relative; border-radius: 26px; overflow: hidden;
      background: linear-gradient(180deg, #d3ecdf 0%, #eaf7f0 62%);
      box-shadow: inset 0 8px 18px rgba(16,86,55,.22), inset 0 -2px 0 rgba(255,255,255,.85); }
    .ta-mouth { position: absolute; left: 50%; bottom: 30px; width: 250px; height: 26px; margin-left: -125px;
      border-radius: 999px; background: #0f3d2a;
      box-shadow: inset 0 5px 10px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.7);
      transition: width 300ms cubic-bezier(.34,1.56,.64,1); }
    .ta-chute:hover .ta-mouth { width: 286px; margin-left: -143px; }
    .ta-mouth i { position: absolute; inset: 3px 10px auto; height: 5px; border-radius: 999px;
      background: var(--acc, #22c55e); opacity: .55; filter: blur(3px);
      animation: ta-breathe 2.6s ease-in-out infinite; }
    @keyframes ta-breathe { 0%, 100% { opacity: .3; } 50% { opacity: .85; } }

    .ta-card { position: absolute; left: 50%; border-radius: 14px; background: #fff;
      box-shadow: 0 12px 22px -8px rgba(16,86,55,.3), inset 0 0 0 1px rgba(16,86,55,.07);
      display: flex; align-items: center; gap: 8px; padding: 10px 13px;
      font-size: 12.5px; white-space: nowrap;
      transition: transform 380ms cubic-bezier(.34,1.56,.64,1), opacity 260ms ease; }
    .ta-chute:hover .ta-c1 { transform: translate(-50%, 16px) rotate(-4deg) scale(.94); }
    .ta-chute:hover .ta-c2 { transform: translate(-50%, 22px) rotate(3deg) scale(.94); }
    .ta-chute:hover .ta-c3 { transform: translate(-50%, 28px) rotate(-1deg) scale(.94); }

    .phase-sending .ta-c1, .phase-sending .ta-c2, .phase-sending .ta-c3 { transform: translate(-50%, 120px) scale(.3); opacity: 0; }
    .phase-sending .ta-c2 { transition-delay: 90ms; }
    .phase-sending .ta-c3 { transition-delay: 180ms; }
    .phase-done .ta-card { opacity: 0; }

    .ta-ripple { position: absolute; left: 50%; bottom: 26px; width: 250px; height: 34px; margin-left: -125px;
      border-radius: 999px; box-shadow: 0 0 0 2px var(--acc, #22c55e); opacity: 0; }
    .phase-sending .ta-ripple { animation: ta-ripple 1.1s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes ta-ripple { 0% { transform: scale(.9); opacity: .5; } 100% { transform: scale(1.5); opacity: 0; } }

    .ta-pop { animation: ta-pop 520ms cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes ta-pop { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }

    .ta-row { transition: transform 200ms cubic-bezier(.34,1.56,.64,1), box-shadow 200ms; }
    .ta-row:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -12px rgba(16,86,55,.3), inset 0 0 0 1px rgba(16,86,55,.08); }
    .ta-mini { transition: background 160ms, color 160ms, transform 160ms cubic-bezier(.34,1.56,.64,1); }
    .ta-mini:hover { background: #0f3d2a; color: #eafaf1; transform: scale(1.05); }
  </style>
</helmet>

<div class="ta phase-{{phase}}" style="width: 1120px; height: 760px; position: relative; overflow: hidden; background: #eef7f1; color: #10261c; font-family: 'Outfit', 'Helvetica Neue', Helvetica, Arial, sans-serif; --acc: {{accent}}">
  <div class="ta-blob" style="width: 460px; height: 460px; top: -160px; left: -110px; background: {{accent}}; opacity: .14"></div>
  <div class="ta-blob" style="width: 380px; height: 380px; bottom: -170px; right: -90px; background: #7dd3a8; opacity: .18"></div>

  <!-- floating header -->
  <header class="ta-pop" style="position: relative; display: flex; align-items: center; gap: 18px; margin: 18px 22px 0; padding: 9px 9px 9px 18px; border-radius: 999px; background: rgba(255,255,255,.75); box-shadow: 0 8px 24px -14px rgba(16,86,55,.4), inset 0 0 0 1px rgba(255,255,255,.9)">
    <div style="display: flex; align-items: center; gap: 9px">
      <span style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 10px; background: {{accent}}; box-shadow: inset 0 -2px 0 rgba(0,0,0,.12)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6m0 0-5 5m5-5 5 5"></path></svg>
      </span>
      <span style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', Helvetica, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -.02em">Fileporter</span>
    </div>
    <nav class="ta-nav" style="display: flex; gap: 4px">
      <button class="ta-pill" style="padding: 8px 17px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: #fff; background: #10261c">Send</button>
      <button class="ta-pill" style="padding: 8px 17px; border-radius: 999px; font-size: 13.5px; color: #5a7568">Devices</button>
      <button class="ta-pill" style="padding: 8px 17px; border-radius: 999px; font-size: 13.5px; color: #5a7568">Activity</button>
    </nav>
    <div style="flex-grow: 1"></div>
    <span style="display: flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 999px; font-size: 12.5px; color: #17915c; background: rgba(34,197,94,.12)">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: {{accent}}"></span>2 devices online
    </span>
    <button class="ta-pill" aria-label="Settings" style="display: flex; padding: 9px; border-radius: 999px; color: #5a7568; background: rgba(16,38,28,.05)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"></path></svg>
    </button>
  </header>

  <div style="position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 306px; gap: 22px; padding: 22px 22px 0">

    <!-- chute -->
    <section style="display: flex; flex-direction: column; gap: 14px">
      <button class="ta-chute" onClick="{{send}}" style="display: block; width: 100%; padding: 12px; border-radius: 34px; text-align: left; background: #fff; box-shadow: 0 20px 44px -22px rgba(16,86,55,.36), 0 3px 0 #dcefe4, inset 0 2px 0 rgba(255,255,255,.9)">
        <div class="ta-slot" style="height: 392px">
          <div class="ta-card ta-c1" style="top: 66px; transform: translate(-50%, 0) rotate(-6deg)">
            <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 7px; background: rgba(34,197,94,.14); color: #17915c">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"></path></svg>
            </span>Q3-review.pdf
          </div>
          <div class="ta-card ta-c2" style="top: 116px; transform: translate(-50%, 0) rotate(4deg)">
            <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 7px; background: rgba(34,197,94,.14); color: #17915c">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            </span>shoot-raws · 312 items
          </div>
          <div class="ta-card ta-c3" style="top: 166px; transform: translate(-50%, 0) rotate(-2deg)">
            <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 7px; background: rgba(34,197,94,.14); color: #17915c">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="m3 15 5-5 4 4 3-3 6 6"></path></svg>
            </span>site-hero.png
          </div>

          <div style="position: absolute; left: 0; right: 0; top: 234px; display: flex; flex-direction: column; align-items: center; gap: 8px">
            <span style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', Helvetica, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -.03em">{{chuteTitle}}</span>
            <span style="font-size: 13.5px; color: #5a7568">{{chuteNote}}</span>
          </div>

          <div class="ta-ripple"></div>
          <div class="ta-mouth"><i></i></div>
        </div>
      </button>

      <div style="display: flex; gap: 9px">
        <button class="ta-pill" style="padding: 11px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: #fff; background: #10261c; box-shadow: 0 8px 18px -10px rgba(16,38,28,.7)">Browse files</button>
        <button class="ta-pill" style="padding: 11px 20px; border-radius: 999px; font-size: 13.5px; color: #10261c; background: #fff; box-shadow: inset 0 0 0 1px rgba(16,86,55,.12)">Browse folder</button>
        <div style="flex-grow: 1"></div>
        <span style="align-self: center; font-size: 12px; color: #7c9184">Encrypted · stays on your network</span>
      </div>
    </section>

    <!-- side -->
    <aside style="display: flex; flex-direction: column; gap: 18px">
      <section class="ta-pop" style="display: flex; flex-direction: column; gap: 11px; padding: 18px; border-radius: 24px; background: rgba(255,255,255,.78); box-shadow: inset 0 0 0 1px rgba(255,255,255,.9)">
        <span style="font-size: 12px; font-weight: 500; color: #7c9184">Sending to</span>
        <sc-for list="{{devices}}" as="d" hint-placeholder-count="3">
          <button class="ta-pill" style="{{d.rowStyle}}" onClick="{{d.pick}}">
            <span style="{{d.iconStyle}}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="12.5" rx="2"></rect><path d="M2 20h20"></path></svg>
            </span>
            <span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; text-align: left">
              <strong style="font-size: 13.5px; font-weight: 500">{{d.name}}</strong>
              <span style="{{d.metaStyle}}">{{d.meta}}</span>
            </span>
            <span style="{{d.checkStyle}}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 6.5"></path></svg>
            </span>
          </button>
        </sc-for>
      </section>

      <section class="ta-pop" style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; font-weight: 500; color: #7c9184; padding-left: 4px">Just arrived</span>
        <sc-for list="{{arrivals}}" as="a" hint-placeholder-count="2">
          <article class="ta-row" style="display: flex; flex-direction: column; gap: 9px; padding: 14px; border-radius: 20px; background: #fff; box-shadow: inset 0 0 0 1px rgba(16,86,55,.07)">
            <div style="display: flex; align-items: center; gap: 10px">
              <span style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 10px; background: rgba(34,197,94,.13); color: #17915c">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icon}}"></path></svg>
              </span>
              <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
                <strong style="font-size: 13px; font-weight: 500">{{a.name}}</strong>
                <span style="font-size: 11.5px; color: #7c9184">{{a.meta}}</span>
              </span>
            </div>
            <div style="display: flex; gap: 6px">
              <span class="ta-mini" style="flex-grow: 1; text-align: center; padding: 7px 0; border-radius: 999px; font-size: 12px; background: rgba(16,38,28,.05)">Copy</span>
              <span class="ta-mini" style="flex-grow: 1; text-align: center; padding: 7px 0; border-radius: 999px; font-size: 12px; background: rgba(16,38,28,.05)">Cut</span>
            </div>
          </article>
        </sc-for>
      </section>
    </aside>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#22c55e","options":["#22c55e","#16a34a","#4ade80","#059669"]},"$preview":{"width":1120,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: ['mbp', 'studio'], phase: 'idle' };
  }
  toggle(id) {
    const picked = this.state.picked.includes(id)
      ? this.state.picked.filter((v) => v !== id)
      : this.state.picked.concat([id]);
    this.setState({ picked: picked });
  }
  send() {
    if (this.state.phase !== 'idle') return;
    this.setState({ phase: 'sending' });
    setTimeout(() => this.setState({ phase: 'done' }), 2300);
    setTimeout(() => this.setState({ phase: 'idle' }), 4100);
  }
  renderVals() {
    const acc = this.props.accent ?? '#22c55e';
    const raw = [
      { id: 'mbp', name: 'MacBook Pro', meta: 'Online · 2 m away', online: true },
      { id: 'studio', name: 'Studio', meta: 'Online · wired', online: true },
      { id: 'thinkpad', name: 'ThinkPad', meta: 'Offline · will queue', online: false }
    ];
    const devices = raw.map((d) => {
      const sel = this.state.picked.includes(d.id);
      return {
        name: d.name,
        meta: d.meta,
        pick: () => this.toggle(d.id),
        rowStyle: 'display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 16px; '
          + (sel
            ? 'background: rgba(34,197,94,.14); box-shadow: inset 0 0 0 1.5px ' + acc + ';'
            : 'background: #fff; box-shadow: inset 0 0 0 1px rgba(16,86,55,.08);'),
        iconStyle: 'display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0; '
          + (sel ? 'color: #fff; background: ' + acc + ';' : 'color: ' + (d.online ? '#17915c' : '#9aae9f') + '; background: rgba(16,38,28,.05);'),
        metaStyle: 'font-size: 11.5px; color: ' + (d.online ? '#7c9184' : '#9aae9f') + ';',
        checkStyle: 'display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; '
          + (sel ? 'color: #fff; background: ' + acc + ';' : 'color: transparent; box-shadow: inset 0 0 0 1.5px rgba(16,86,55,.15);')
      };
    });
    const count = this.state.picked.length;
    const phase = this.state.phase;
    return {
      devices: devices,
      phase: phase,
      chuteTitle: phase === 'sending' ? 'Off it goes' : phase === 'done' ? 'Landed' : 'Feed it anything',
      chuteNote: phase === 'sending'
        ? '84 MB/s · checking every byte on the way'
        : phase === 'done'
          ? 'Both devices confirmed receipt'
          : count === 0 ? 'Pick a device on the right first' : 'Drop here and it appears on ' + count + ' device' + (count === 1 ? '' : 's'),
      arrivals: [
        { name: 'Q3-review.pdf', meta: '4.2 MB · from Studio', icon: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5' },
        { name: 'shoot-raws', meta: '312 items · from MacBook Pro', icon: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' }
      ],
      send: () => this.send()
    };
  }
}
</script>
</body>
</html>
