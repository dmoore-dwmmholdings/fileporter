<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #74e6a0; } a:hover { color: #a8f5c6; }
    .tp * { box-sizing: border-box; }
    .tp button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .tp input { font: inherit; color: inherit; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }

    .tp-grid { position: absolute; inset: 0; pointer-events: none; opacity: .5;
      background-image: linear-gradient(rgba(120,230,160,.045) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(120,230,160,.045) 1px, transparent 1px);
      background-size: 26px 26px; }
    .tp-nav { transition: color 90ms linear, background 90ms linear; }
    .tp-nav:hover { color: #d6f5e2; background: rgba(120,230,160,.07); }
    .tp-nav.on { color: #0b120e; background: var(--acc, #74e6a0); }
    .tp-chip { transition: background 100ms linear, color 100ms linear, box-shadow 100ms linear; }
    .tp-chip:hover { box-shadow: inset 0 0 0 1px var(--acc, #74e6a0); }
    .tp-cta { transition: background 100ms linear, color 100ms linear; }
    .tp-cta:hover { background: var(--acc, #74e6a0); color: #0b120e; }
    .tp-row { transition: background 100ms linear; }
    .tp-row:hover { background: rgba(120,230,160,.06); }
    .blink { animation: blink 1.05s steps(1, end) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .fade { animation: fade 300ms steps(5, end) both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* ═══════════════════════════════════════════════════ chamber shell */
    .ch { position: relative; display: block; width: 100%; overflow: hidden; padding: 0;
      background: #070d0a;
      box-shadow: inset 0 0 0 1px rgba(120,230,160,.20), inset 0 0 90px rgba(0,0,0,.7);
      transition: box-shadow 120ms linear; }
    .ch:hover { box-shadow: inset 0 0 0 1px rgba(120,230,160,.4), inset 0 0 90px rgba(0,0,0,.7); }
    .ch-vig { position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(115% 78% at 50% 108%, rgba(120,230,160,.16) 0%, transparent 58%),
                  radial-gradient(90% 60% at 50% -8%, rgba(120,230,160,.07) 0%, transparent 62%); }
    .ch-noise { position: absolute; inset: 0; pointer-events: none; opacity: .45;
      background-image: radial-gradient(rgba(120,230,160,.10) .6px, transparent .6px); background-size: 3px 3px; }

    /* ribbed side walls */
    .wall { position: absolute; top: 0; bottom: 0; width: 42px; pointer-events: none;
      background:
        repeating-linear-gradient(180deg, rgba(120,230,160,.10) 0 1px, transparent 1px 34px),
        linear-gradient(90deg, rgba(120,230,160,.07), transparent); }
    .wall.r { transform: scaleX(-1); }
    .wall::after { content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 1px;
      background: rgba(120,230,160,.18); }
    .frame-no { position: absolute; font-size: 9px; letter-spacing: .1em; color: #8aa398; }

    .br { position: absolute; width: 20px; height: 20px; transition: all 150ms steps(3, end); }
    .ch:hover .br { width: 34px; height: 34px; }

    /* emitter pylons */
    .pyl { opacity: .72; transition: opacity 200ms linear; }
    .pylcore { opacity: .6; animation: pylbreathe 3.9s ease-in-out infinite; }
    .pyltip { animation: blink 1.9s steps(1, end) infinite; }
    .pyltip.back { animation-delay: .95s; }
    .pylcore.back { animation-delay: .9s; }
    @keyframes pylbreathe { 0%, 100% { opacity: .26; } 50% { opacity: .56; } }
    .ch:hover .pylcore { animation-duration: 1.5s; }
    .drag .pylcore { animation-duration: 1s; }
    .ph-beam .pylcore { animation-duration: .4s; }
    .ph-engage .pylcore { animation-duration: .6s; }

    /* ═══════════════════════════════════════════ back-wall alcoves */
    .alc { position: absolute; top: 25.36%; width: 7.914%; margin-left: -3.957%; padding: 6px 5px 5px;
      display: flex; flex-direction: column; gap: 4px; align-items: stretch;
      background: rgba(4,8,6,.82); box-shadow: inset 0 0 0 1px rgba(120,230,160,.14), inset 0 6px 14px rgba(0,0,0,.7);
      transition: box-shadow 150ms linear, background 150ms linear; }
    .alc .aname { font-size: 9.5px; letter-spacing: .14em; color: #8aa398; text-align: center; transition: color 150ms; }
    .alc .astat { font-size: 8.5px; letter-spacing: .14em; color: #8aa398; text-align: center; }
    .alc .ap { opacity: .22; transition: opacity 150ms linear; }
    .alc .pbar { display: block; height: 3px; background: rgba(120,230,160,.12); }
    .alc .pbar i { display: block; height: 100%; width: 0; background: var(--acc, #74e6a0); }
    .alc .pring { position: absolute; inset: -1px; box-shadow: 0 0 0 1px var(--acc, #74e6a0); opacity: 0; }
    .sel-mbp .alc-mbp, .sel-studio .alc-studio, .sel-tp .alc-tp {
      background: rgba(120,230,160,.07); box-shadow: inset 0 0 0 1px rgba(120,230,160,.5), inset 0 6px 14px rgba(0,0,0,.6); }
    .sel-mbp .alc-mbp .aname, .sel-studio .alc-studio .aname, .sel-tp .alc-tp .aname { color: #eaf6ef; }
    .sel-mbp .alc-mbp .astat, .sel-studio .alc-studio .astat, .sel-tp .alc-tp .astat { color: var(--acc, #74e6a0); }
    .sel-mbp .alc-mbp .ap, .sel-studio .alc-studio .ap, .sel-tp .alc-tp .ap { opacity: .95; }

    /* ═══════════════════════════════════════════════════ coils + beam */
    .beam { position: absolute; left: 0; right: 0; top: 20%; bottom: 21.43%; pointer-events: none; transition: opacity 180ms linear; }
    .beam-o { clip-path: polygon(39% 0, 61% 0, 65% 100%, 35% 100%); opacity: .8; filter: blur(16px);
      background: linear-gradient(180deg, rgba(120,230,160,0), rgba(120,230,160,.5) 62%, rgba(190,255,215,.8)); }
    .beam-m { z-index: 1; clip-path: polygon(44% 0, 56% 0, 59% 100%, 41% 100%); opacity: .8; overflow: hidden;
      background: linear-gradient(180deg, rgba(120,230,160,0), rgba(120,230,160,.4) 60%, rgba(190,255,215,.62)); }
    .beam-c { z-index: 2; clip-path: polygon(49.5% 0, 50.5% 0, 50.4% 100%, 49.6% 100%); opacity: .85;
      background: linear-gradient(180deg, rgba(120,230,160,0), rgba(190,255,215,1)); }
        .ch:hover .beam-o { opacity: .62; } .ch:hover .beam-m { opacity: .72; } .ch:hover .beam-c { opacity: .95; }
    .beam-m::after { content: ''; position: absolute; inset: -30px 0;
      background: repeating-linear-gradient(180deg, rgba(190,255,215,.085) 0 1.5px, transparent 1.5px 26px);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 55%, #000 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 55%, #000 100%);
      animation: beamflow 3.1s linear infinite; }
    @keyframes beamflow { to { transform: translateY(27.5px); } }
    .ch:hover .beam-m::after { animation-duration: 1.3s; }
    .ph-beam .beam-m::after { animation-duration: .34s; }
    .beam-o { animation: beambreathe 4.6s ease-in-out infinite; }
    @keyframes beambreathe { 0%, 100% { opacity: .34; } 50% { opacity: .52; } }
    .beam-c { animation: corepulse 2.8s ease-in-out infinite; }
    @keyframes corepulse { 0%, 100% { opacity: .45; } 50% { opacity: .8; } }

        .landing { z-index: 2; position: absolute; left: 50%; top: 71.07%; width: 35.97%; height: 15%; transform: translateX(-50%);
      pointer-events: none; border-radius: 50%; filter: blur(16px);
      background: radial-gradient(closest-side, rgba(190,255,215,.5), rgba(120,230,160,.16) 55%, transparent);
      animation: landbreathe 3.9s ease-in-out infinite; }
    @keyframes landbreathe { 0%, 100% { opacity: .5; } 50% { opacity: .85; } }
    .ch:hover .landing { animation-duration: 1.5s; }
    .drag .landing { animation-duration: 1s; }
    .ph-beam .landing { opacity: 1; animation: flick .16s steps(2, end) infinite; }

    .mote { position: absolute; bottom: 21.43%; width: 2px; height: 9px; background: var(--acc, #74e6a0); opacity: 0;
      animation: riseIdle 4.2s steps(16, end) infinite; }
    @keyframes riseIdle { 0% { transform: translateY(0); opacity: 0; } 22% { opacity: .4; } 100% { transform: translateY(-260px); opacity: 0; } }

    /* ═══════════════════════════════════════════════════ pad */
    .pad-seg { opacity: .16; }
    .pad-segs .s0 { animation: segfire 2.2s steps(1, end) infinite; }
    .pad-segs .s1 { animation: segfire 2.2s steps(1, end) infinite .28s; }
    .pad-segs .s2 { animation: segfire 2.2s steps(1, end) infinite .56s; }
    .pad-segs .s3 { animation: segfire 2.2s steps(1, end) infinite .84s; }
    .pad-segs .s4 { animation: segfire 2.2s steps(1, end) infinite 1.12s; }
    .pad-segs .s5 { animation: segfire 2.2s steps(1, end) infinite 1.4s; }
    .pad-segs .s6 { animation: segfire 2.2s steps(1, end) infinite 1.68s; }
    .pad-segs .s7 { animation: segfire 2.2s steps(1, end) infinite 1.96s; }
    @keyframes segfire { 0% { opacity: .85; } 22%, 100% { opacity: .14; } }
    .pad-node { animation: blink 1.6s steps(1, end) infinite; }
    .pad-node.n1 { animation-delay: .2s; } .pad-node.n2 { animation-delay: .4s; }
    .pad-node.n3 { animation-delay: .6s; } .pad-node.n4 { animation-delay: .8s; }
    .pad-node.n5 { animation-delay: 1s; }  .pad-node.n6 { animation-delay: 1.2s; }
    .pad-node.n7 { animation-delay: 1.4s; }
    .pool { animation: poolbreathe 3.9s ease-in-out infinite; }
    @keyframes poolbreathe { 0%, 100% { opacity: .62; } 50% { opacity: .92; } }
    .ch:hover .pool { animation-duration: 1.5s; }
    .ph-beam .pool { opacity: 1; animation: flick .16s steps(2, end) infinite; }
    .strip { animation: stripe 3.4s ease-in-out infinite; }
    @keyframes stripe { 0%, 100% { opacity: .1; } 50% { opacity: .3; } }
    .pad-core { animation: padbreathe 3.9s ease-in-out infinite; }
    @keyframes padbreathe { 0%, 100% { opacity: .58; } 50% { opacity: .88; } }
    .ch:hover .pad-core { animation-duration: 1.5s; }
    .ph-beam .pad-core { animation-duration: .5s; }

    /* flank instrument panels */
    .ipanel { position: absolute; display: flex; flex-direction: column; gap: 5px; width: 148px;
      padding: 9px 10px; background: rgba(6,11,9,.8); box-shadow: inset 0 0 0 1px rgba(120,230,160,.16); }
    .il { transform: perspective(760px) rotateY(21deg); transform-origin: left center; }
    .ir { transform: perspective(760px) rotateY(-21deg); transform-origin: right center; }
    .ihead { font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 8.5px; letter-spacing: .18em; color: #8aa398; padding-bottom: 4px;
      border-bottom: 1px solid rgba(120,230,160,.14); }
    .irow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .ik { font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 9px; letter-spacing: .11em; color: #8aa398; }
    .iv { font-size: 10px; color: #d6e5db; }
    .ibar { display: block; height: 3px; margin-top: 3px; background: rgba(120,230,160,.12); }
    .ibar i { display: block; height: 100%; background: var(--acc, #74e6a0); }
    .ifoot { font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 8.5px; letter-spacing: .14em; color: #8aa398; }

    /* ceiling emitter cells */
    .cell { opacity: .13; }
    .coil { opacity: .3; }
    .tip { opacity: .25; }
    .cells .k0, .coils .c0, .coils .t0 { animation: coilfire 2.1s steps(1, end) infinite; }
    .cells .k1, .coils .c1, .coils .t1 { animation: coilfire 2.1s steps(1, end) infinite .3s; }
    .cells .k2, .coils .c2, .coils .t2 { animation: coilfire 2.1s steps(1, end) infinite .6s; }
    .cells .k3, .coils .c3, .coils .t3 { animation: coilfire 2.1s steps(1, end) infinite .9s; }
    .cells .k4, .coils .c4, .coils .t4 { animation: coilfire 2.1s steps(1, end) infinite 1.2s; }
    .cells .k5, .coils .c5, .coils .t5 { animation: coilfire 2.1s steps(1, end) infinite 1.5s; }
    .cells .k6, .coils .c6, .coils .t6 { animation: coilfire 2.1s steps(1, end) infinite 1.8s; }
    @keyframes coilfire { 0% { opacity: .32; } 40%, 100% { opacity: .12; } }

    /* ═══════════════════════════════════════════════════ payload */
    .load { z-index: 2; position: absolute; left: 50%; top: 52.86%; width: 38.37%; transform: translateX(-50%)
      display: flex; flex-direction: column; gap: 7px; pointer-events: none;
      transform: translateX(-50%) perspective(820px) rotateX(19deg); transform-origin: center bottom; }
    .pkt { position: relative; overflow: hidden; display: flex; align-items: center; gap: 9px;
      padding: 8px 12px; background: linear-gradient(180deg, #1a2a22, #0b1611);
      box-shadow: inset 0 1px 0 rgba(190,255,215,.34), inset 0 0 0 1px rgba(120,230,160,.4),
                  0 8px 22px rgba(0,0,0,.6), 0 0 22px rgba(120,230,160,.10);
      font-size: 11.5px; color: #e2efe7; transition: transform 160ms steps(3, end); }
    .ch:hover .pkt { transform: translateY(-5px); }
    .pkt::after { content: ''; position: absolute; left: 8%; right: 8%; bottom: -9px; height: 9px;
      background: radial-gradient(closest-side, rgba(0,0,0,.55), transparent); pointer-events: none; }
    .pkt em { position: absolute; inset: 0; opacity: 0;
      background: repeating-linear-gradient(0deg, rgba(120,230,160,.6) 0 1px, transparent 1px 4px); }
    .pkt b { position: absolute; left: 0; right: 0; height: 2px; top: -3px; background: var(--acc, #74e6a0);
      box-shadow: 0 0 10px var(--acc, #74e6a0); opacity: 0; }

    /* ═══════════════════════════════════════════════════ readout */
    .ro { z-index: 3; position: absolute; left: 50%; top: 42.14%; transform: translateX(-50%); display: flex;
      flex-direction: column; align-items: center; gap: 9px; pointer-events: none; }
        .ro::before, .ro::after { content: ''; position: absolute; top: 15px; width: 96px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(190,255,215,.55)); }
    .ro::before { left: -116px; }
    .ro::after { right: -116px; transform: scaleX(-1); }
    .ro h2 { margin: 0; font-size: 17px; font-weight: 500; letter-spacing: .26em; color: #f2fff7;
      text-shadow: 0 0 22px rgba(190,255,215,.55), 0 0 46px rgba(120,230,160,.35), 0 2px 12px rgba(0,0,0,.95); }
    .seg-bar { display: flex; gap: 2px; padding: 3px; background: rgba(4,9,7,.55); box-shadow: inset 0 0 0 1px rgba(120,230,160,.28); transition: opacity 160ms linear; }
    .seg-bar span { width: 12px; height: 6px; background: rgba(120,230,160,.1); }
    .ph-idle .seg-bar { opacity: 0; }

    /* ═══════════════════════════════════════════ drag-over: armed */
    .drag .ch { box-shadow: inset 0 0 0 2px var(--acc, #74e6a0), inset 0 0 90px rgba(0,0,0,.7); }
    .drag .br { width: 46px; height: 46px; }
    .drag .beam-o { opacity: .72; } .drag .beam-m { opacity: .8; } .drag .beam-c { opacity: 1; }
    .drag .beam-m::after { animation-duration: .7s; }
    .drag .pad-core, .drag .pool { animation-duration: 1s; }
    .drag .pad-segs .pad-seg { animation-duration: .55s; }
    .drag .cells .cell { animation-duration: .9s; }
    .drag .mote { animation-duration: 1.5s; }
    .drag .seg-bar { opacity: .5; }
    .drag .ro h2 { text-shadow: 0 0 26px rgba(190,255,215,.85), 0 0 60px rgba(120,230,160,.5), 0 2px 12px rgba(0,0,0,.95); }
    .drag .load .pkt { transform: translateY(-9px); }
    .drag .sweep { animation-duration: 2.4s; }

    /* ═══════════════════════════════════════════ phase: ENGAGE (scan) */
    .ph-engage .pkt em { animation: scanline 1.2s steps(14, end) forwards; }
    @keyframes scanline { 0% { opacity: 0; background-position-y: 0; } 20% { opacity: 1; } 100% { opacity: .85; background-position-y: 40px; } }
    .ph-engage .pkt b { animation: scanbar 1.2s steps(16, end) forwards; }
    @keyframes scanbar { 0% { opacity: 1; top: -3px; } 100% { opacity: 1; top: 100%; } }
    .ph-engage .br { width: 44px; height: 44px; }
    .ph-engage .pad-segs .pad-seg { animation-duration: .6s; }

    /* ═══════════════════════════════════════════ phase: BEAM (transit) */
    .ph-beam .pkt { animation: demat 700ms steps(10, end) forwards; }
    .ph-beam .pkt:nth-child(2) { animation-delay: 110ms; }
    .ph-beam .pkt:nth-child(3) { animation-delay: 220ms; }
    @keyframes demat {
      0%   { transform: translateY(0) scaleX(1); opacity: 1; }
      25%  { transform: translateY(-7px) scaleX(1.03); opacity: 1; }
      100% { transform: translateY(-150px) scaleX(.45); opacity: 0; }
    }
    .ph-beam .pkt em { opacity: 1; }
    .ph-beam .beam-o { opacity: .55; } .ph-beam .beam-m { opacity: .7; } .ph-beam .beam-c { opacity: 1; }
    .ph-beam .beam { animation: flick .16s steps(2, end) infinite; }
    @keyframes flick { 0% { filter: brightness(1); } 100% { filter: brightness(1.45); } }
    .ph-beam .mote { animation: rise 1s steps(9, end) infinite; }
    .ch:hover .mote { animation-duration: 2.1s; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 18% { opacity: .95; } 100% { transform: translateY(-330px); opacity: 0; } }
    .ph-beam .coil { animation-duration: .45s !important; }
    .ph-beam .pad-segs .pad-seg { animation-duration: .4s; }
    
    .ph-beam .pad-core { opacity: 1; }
    .ph-beam .ibar i { animation: pfill 2s steps(20, end) forwards; }
    .ph-beam .flow { opacity: 0; }
    .ph-beam.sel-mbp .alc-mbp .pbar i, .ph-beam.sel-studio .alc-studio .pbar i, .ph-beam.sel-tp .alc-tp .pbar i { animation: pfill 2s steps(20, end) forwards; }
    @keyframes pfill { from { width: 0; } to { width: 88%; } }
    .ph-beam .seg-bar span { animation: segload 2s steps(1, end) forwards; }
    @keyframes segload { to { background: var(--acc, #74e6a0); } }

    /* ═══════════════════════════════════════════ phase: DONE (rebuild) */
    .ph-done .pkt { opacity: 0; }
    .ph-done .alc .pbar i { width: 100%; }
    .ph-done .alc .pring { animation: pring 800ms cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes pring { 0% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1.12); opacity: 0; } }
    .ph-done .seg-bar span { background: var(--acc, #74e6a0); }
    .ph-done .pad-core { opacity: 1; }

    .shock { position: absolute; left: 50%; top: 69.29%; width: 69.54%; height: 21.79%; margin-left: -34.77%;
      border-radius: 50%; box-shadow: 0 0 0 1px var(--acc, #74e6a0); opacity: 0; pointer-events: none; }
    .ph-done .shock { animation: shock 900ms cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes shock { 0% { transform: scale(.45); opacity: .9; } 100% { transform: scale(1.1); opacity: 0; } }

    /* callouts */
    .sweep { position: absolute; left: 0; right: 0; height: 76px; pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(120,230,160,.07), transparent);
      animation: sweepdown 7.5s linear infinite; }
    @keyframes sweepdown { 0% { top: -80px; } 100% { top: 100%; } }
    .ph-beam .sweep { animation-duration: 1.6s; }
    .callout { position: absolute; font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 9.5px; letter-spacing: .13em; color: #8aa398; pointer-events: none; }
  </style>
</helmet>

<div class="tp ph-{{phase}} {{dragClass}} {{selClass}}" style="width: 1120px; height: 760px; display: flex; overflow: hidden; background: #0b120e; color: #d6e5db; font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; --acc: {{accent}}">

  <!-- ═════════════════════════════════════════════════════════════ rail -->
  <aside style="position: relative; display: flex; flex-direction: column; gap: 16px; width: 246px; flex-shrink: 0; padding: 18px 16px; border-right: 1px solid rgba(120,230,160,.14); background: #080d0a">
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="{{accent}}" stroke-width="1.2">
        <ellipse cx="10" cy="15" rx="8" ry="3"></ellipse><ellipse cx="10" cy="15" rx="4" ry="1.5"></ellipse>
        <path d="M10 12V2m0 0L6.5 5.5M10 2l3.5 3.5"></path>
      </svg>
      <span class="mono" style="font-size: 12.5px; font-weight: 600; letter-spacing: .12em">FILEPORTER</span>
    </div>
    <div class="mono" style="font-size: 9.5px; letter-spacing: .14em; color: #8aa398; margin-top: -8px">PAD 01 · WORKSHOP IMAC</div>

    <nav style="display: flex; flex-direction: column; gap: 1px">
      <button class="tp-nav on mono" type="button" style="text-align: left; padding: 8px 11px; font-size: 12px; letter-spacing: .06em">01  TRANSPORT</button>
      <button class="tp-nav mono" type="button" style="text-align: left; padding: 8px 11px; font-size: 12px; letter-spacing: .06em; color: #8aa398">02  PADS</button>
      <button class="tp-nav mono" type="button" style="text-align: left; padding: 8px 11px; font-size: 12px; letter-spacing: .06em; color: #8aa398">03  LOG</button>
      <button class="tp-nav mono" type="button" style="text-align: left; padding: 8px 11px; font-size: 12px; letter-spacing: .06em; color: #8aa398">04  CONFIG</button>
    </nav>

    <div style="height: 1px; background: rgba(120,230,160,.14)"></div>

    <div style="display: flex; flex-direction: column; gap: 7px">
