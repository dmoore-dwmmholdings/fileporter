<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #74e6a0; } a:hover { color: #a8f5c6; }
    .q * { box-sizing: border-box; }
    .q button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .q input { font: inherit; color: inherit; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }

    .q-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; pointer-events: none;
      opacity: .45; transition: opacity 600ms ease;
      background: radial-gradient(62% 100% at 50% 126%, rgba(120,230,160,.16), transparent 72%); }
    .on .q-floor { opacity: 1; }

    .field { width: 100%; border: 0; border-bottom: 1px solid rgba(120,230,160,.22); background: none;
      outline: none; padding: 5px 0; transition: border-color 200ms; }
    .field:focus { border-color: var(--acc, #74e6a0); }
    .lbl { font-size: 12px; color: #8aa398; }
    .hint { font-size: 11.5px; line-height: 1.5; color: #6f8579; }

    .sw { position: relative; width: 34px; height: 18px; flex-shrink: 0; border-radius: 999px;
      transition: background 160ms, box-shadow 160ms; }
    .sw i { position: absolute; top: 3px; width: 12px; height: 12px; border-radius: 50%;
      transition: left 180ms cubic-bezier(.22,1,.36,1), background 160ms; }
    .tog { display: flex; align-items: center; gap: 12px; padding: 7px 0; text-align: left; }
    .tog:hover .sw { box-shadow: inset 0 0 0 1px var(--acc, #74e6a0); }

    .cta { transition: transform 180ms cubic-bezier(.22,1,.36,1), box-shadow 180ms, background 220ms; }
    .cta:hover { transform: translateY(-1px); }
    .cta:active { transform: none; }
    .chip { transition: color 160ms, box-shadow 160ms; }
    .chip:hover { box-shadow: inset 0 0 0 1px rgba(120,230,160,.5); color: #d6e5db; }

    .ob-pad { opacity: .42; transition: opacity 700ms ease; }
    .on .ob-pad { opacity: 1; }
    .pad-seg { opacity: .1; }
    .on .pad-seg { opacity: .16; }
    .on .pad-segs .s0 { animation: seg 2.2s steps(1,end) infinite; }
    .on .pad-segs .s1 { animation: seg 2.2s steps(1,end) infinite .28s; }
    .on .pad-segs .s2 { animation: seg 2.2s steps(1,end) infinite .56s; }
    .on .pad-segs .s3 { animation: seg 2.2s steps(1,end) infinite .84s; }
    .on .pad-segs .s4 { animation: seg 2.2s steps(1,end) infinite 1.12s; }
    .on .pad-segs .s5 { animation: seg 2.2s steps(1,end) infinite 1.4s; }
    .on .pad-segs .s6 { animation: seg 2.2s steps(1,end) infinite 1.68s; }
    .on .pad-segs .s7 { animation: seg 2.2s steps(1,end) infinite 1.96s; }
    @keyframes seg { 0% { opacity: .8; } 22%, 100% { opacity: .14; } }
    .pad-node { opacity: .2; }
    .on .pad-node { opacity: 1; animation: blink 1.6s steps(1,end) infinite; }
    .on .pad-node.n1 { animation-delay: .2s; } .on .pad-node.n2 { animation-delay: .4s; }
    .on .pad-node.n3 { animation-delay: .6s; } .on .pad-node.n4 { animation-delay: .8s; }
    .on .pad-node.n5 { animation-delay: 1s; } .on .pad-node.n6 { animation-delay: 1.2s; }
    .on .pad-node.n7 { animation-delay: 1.4s; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .pad-core { opacity: .18; transition: opacity 700ms ease; }
    .on .pad-core { opacity: .7; animation: breathe 3.9s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: .85; } }

    .ring { position: absolute; left: 50%; bottom: 118px; width: 600px; height: 128px; margin-left: -300px;
      border-radius: 50%; box-shadow: 0 0 0 1px var(--acc, #74e6a0); opacity: 0; pointer-events: none; }
    .on .ring { animation: ring 1.1s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes ring { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.14); opacity: 0; } }
    .fade { animation: fade 700ms ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</helmet>

<div class="q {{onClass}}" style="width: 1120px; height: 760px; position: relative; overflow: hidden; background: #0a100d; color: #eaf6ef; font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; --acc: {{accent}}">
  <span class="q-floor"></span>

  <header style="position: relative; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 22px 28px">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="{{accent}}" stroke-width="1.2">
      <ellipse cx="10" cy="15" rx="8" ry="3"></ellipse><path d="M10 12V2m0 0L6.5 5.5M10 2l3.5 3.5"></path>
    </svg>
    <span style="font-size: 13px; font-weight: 500; letter-spacing: -.01em">Fileporter</span>
    <div style="flex-grow: 1"></div>
    <span style="display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: #8aa398">
      <span style="{{dotStyle}}"></span>{{padState}}
    </span>
  </header>

  <div class="fade" style="position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 11px; padding-top: 26px">
    <h1 style="margin: 0; font-size: 44px; font-weight: 300; letter-spacing: -.032em">{{title}}</h1>
    <p style="margin: 0; font-size: 14.5px; font-weight: 300; color: #8aa398; max-width: 62ch; text-align: center">{{sub}}</p>
  </div>

  <div class="fade" style="position: relative; z-index: 3; width: 460px; margin: 34px auto 0; display: flex; flex-direction: column; gap: 20px">
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span class="lbl">Name this pad</span>
      <input class="field" value="Workshop iMac" maxlength="48" style="font-size: 15px" />
      <span class="hint">This is what your other computers will call it.</span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span class="lbl">Where arrivals land</span>
      <span style="display: flex; align-items: baseline; gap: 12px">
        <input class="field mono" value="/Users/dmoore/Fileporter" style="font-size: 13.5px" />
        <button class="chip" type="button" style="flex-shrink: 0; padding: 4px 13px; border-radius: 999px; font-size: 12.5px; color: #8aa398; box-shadow: inset 0 0 0 1px rgba(120,230,160,.24)">Choose</button>
      </span>
      <span class="hint">Checked for write access before it is saved. Nothing there is ever overwritten.</span>
    </label>
    <div style="display: flex; flex-direction: column; gap: 0; margin-top: -2px">
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
        <button class="tog" type="button" onClick="{{t.flip}}">
          <span class="sw" style="{{t.sw}}"><i style="{{t.knob}}"></i></span>
          <span style="font-size: 13.5px">{{t.label}}</span>
        </button>
      </sc-for>
    </div>
    <button class="cta" type="button" onClick="{{engage}}" style="{{ctaStyle}}">{{cta}}</button>
    <span class="hint" style="text-align: center; margin-top: -8px">{{ctaNote}}</span>
  </div>

  <span class="ring"></span>
  <svg class="ob-pad" viewBox="0 0 700 190" preserveAspectRatio="xMidYMid meet" style="position: absolute; left: 50%; bottom: 4px; width: 680px; margin-left: -340px; height: 184px"><defs><linearGradient id="deck2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="{{accent}}" stop-opacity=".30"/><stop offset="52%" stop-color="{{accent}}" stop-opacity=".10"/><stop offset="100%" stop-color="{{accent}}" stop-opacity=".035"/></linearGradient><linearGradient id="rim2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="{{accent}}" stop-opacity=".46"/><stop offset="100%" stop-color="{{accent}}" stop-opacity=".06"/></linearGradient><radialGradient id="core2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e8fff2" stop-opacity=".92"/><stop offset="22%" stop-color="{{accent}}" stop-opacity=".58"/><stop offset="100%" stop-color="{{accent}}" stop-opacity="0"/></radialGradient></defs><path d="M18 96 A332 68 0 0 0 682 96 L682 124 A332 68 0 0 1 18 124 Z" fill="url(#rim2)"/><path d="M18.0 96.0 L18.0 124.0 M20.1 88.4 L20.1 116.4 M26.3 80.9 L26.3 108.9 M36.6 73.5 L36.6 101.5 M50.9 66.5 L50.9 94.5 M68.9 59.8 L68.9 87.8 M90.5 53.6 L90.5 81.6 M115.3 47.9 L115.3 75.9 M143.1 42.8 L143.1 70.8 M173.4 38.4 L173.4 66.4 M206.0 34.7 L206.0 62.7 M240.4 31.8 L240.4 59.8 M276.2 29.7 L276.2 57.7 M312.9 28.4 L312.9 56.4 M350.1 28.0 L350.1 56.0 M387.3 28.4 L387.3 56.4 M424.0 29.7 L424.0 57.7 M459.8 31.8 L459.8 59.8 M494.2 34.7 L494.2 62.7 M526.8 38.4 L526.8 66.4 M557.1 42.9 L557.1 70.9 M584.9 47.9 L584.9 75.9 M609.7 53.6 L609.7 81.6 M631.2 59.9 L631.2 87.9 M649.2 66.5 L649.2 94.5 M663.4 73.6 L663.4 101.6 M673.7 80.9 L673.7 108.9 M679.9 88.4 L679.9 116.4 M682.0 96.0 L682.0 124.0" stroke="{{accent}}" stroke-width=".9" opacity=".26" fill="none"/><path d="M18 96 A332 68 0 0 0 682 96" fill="none" stroke="{{accent}}" stroke-width="2" opacity="1"/><path d="M18 124 A332 68 0 0 0 682 124" fill="none" stroke="{{accent}}" stroke-width="1.1" opacity=".34"/><ellipse cx="350" cy="96" rx="332" ry="68" fill="url(#deck2)"/><path d="M672.0 96.0 L500.0 96.0 M647.5 121.3 L488.6 107.9 M577.7 142.7 L456.1 117.9 M473.2 157.0 L407.4 124.6 M350.0 162.0 L350.0 127.0 M226.8 157.0 L292.6 124.6 M122.3 142.7 L243.9 117.9 M52.5 121.3 L211.4 107.9 M28.0 96.0 L200.0 96.0 M52.5 70.7 L211.4 84.1 M122.3 49.3 L243.9 74.1 M226.8 35.0 L292.6 67.4 M350.0 30.0 L350.0 65.0 M473.2 35.0 L407.4 67.4 M577.7 49.3 L456.1 74.1 M647.5 70.7 L488.6 84.1" stroke="{{accent}}" stroke-width="1" opacity=".14" fill="none"/><path class="pad-seg s0" d="M663.7 98.7 A314 64 0 0 1 644.9 118.0" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s1" d="M634.8 122.9 A314 64 0 0 1 581.1 139.3" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s2" d="M562.5 143.1 A314 64 0 0 1 482.2 154.1" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s3" d="M457.9 156.1 A314 64 0 0 1 363.1 159.9" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s4" d="M336.9 159.9 A314 64 0 0 1 242.1 156.1" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s5" d="M217.8 154.1 A314 64 0 0 1 137.5 143.1" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s6" d="M118.9 139.3 A314 64 0 0 1 65.2 122.9" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s7" d="M55.1 118.0 A314 64 0 0 1 36.3 98.7" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s0" d="M36.3 93.3 A314 64 0 0 1 55.1 74.0" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s1" d="M65.2 69.1 A314 64 0 0 1 118.9 52.7" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s2" d="M137.5 48.9 A314 64 0 0 1 217.8 37.9" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s3" d="M242.1 35.9 A314 64 0 0 1 336.9 32.1" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s4" d="M363.1 32.1 A314 64 0 0 1 457.9 35.9" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s5" d="M482.2 37.9 A314 64 0 0 1 562.5 48.9" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s6" d="M581.1 52.7 A314 64 0 0 1 634.8 69.1" fill="none" stroke="{{accent}}" stroke-width="1.8"/><path class="pad-seg s7" d="M644.9 74.0 A314 64 0 0 1 663.7 93.3" fill="none" stroke="{{accent}}" stroke-width="1.8"/><ellipse cx="350" cy="96" rx="322" ry="66" fill="none" stroke="{{accent}}" stroke-width="1" opacity="0.42"/><ellipse cx="350" cy="96" rx="262" ry="54" fill="none" stroke="{{accent}}" stroke-width="1" opacity="0.17"/><ellipse cx="350" cy="96" rx="206" ry="42" fill="none" stroke="{{accent}}" stroke-width="1" opacity="0.15"/><ellipse cx="350" cy="96" rx="150" ry="31" fill="none" stroke="{{accent}}" stroke-width="1" opacity="0.34"/><ellipse class="pad-core" cx="350" cy="96" rx="150" ry="31" fill="url(#core2)"/><ellipse cx="350" cy="96" rx="150" ry="31" fill="none" stroke="{{accent}}" stroke-width="1.5" opacity=".9"/><rect x="649.2" y="117.0" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n0" cx="656.7" cy="122.0" r="2.3" fill="{{accent}}"/><rect x="469.6" y="153.8" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n1" cx="477.1" cy="158.8" r="2.3" fill="{{accent}}"/><rect x="215.4" y="153.8" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n2" cx="222.9" cy="158.8" r="2.3" fill="{{accent}}"/><rect x="35.8" y="117.0" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n3" cx="43.3" cy="122.0" r="2.3" fill="{{accent}}"/><rect x="35.8" y="65.0" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n4" cx="43.3" cy="70.0" r="2.3" fill="{{accent}}"/><rect x="215.4" y="28.2" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n5" cx="222.9" cy="33.2" r="2.3" fill="{{accent}}"/><rect x="469.6" y="28.2" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n6" cx="477.1" cy="33.2" r="2.3" fill="{{accent}}"/><rect x="649.2" y="65.0" width="15" height="10" rx="1" fill="#081009" stroke="{{accent}}" stroke-width="1" opacity=".8"/><circle class="pad-node n7" cx="656.7" cy="70.0" r="2.3" fill="{{accent}}"/></svg>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#74e6a0","options":["#74e6a0","#5ddc8f","#9cf5bd","#3fcf7c"]},"$preview":{"width":1120,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { online: false, launch: true, notify: true };
  }
  flip(k) { const n = {}; n[k] = !this.state[k]; this.setState(n); }
  renderVals() {
    const acc = this.props.accent ?? '#74e6a0';
    const on = this.state.online;
    const t = (key, label) => {
      const v = this.state[key];
      return {
        label: label, flip: () => this.flip(key),
        sw: v ? 'background: rgba(120,230,160,.22); box-shadow: inset 0 0 0 1px ' + acc + ';'
              : 'background: rgba(120,230,160,.05); box-shadow: inset 0 0 0 1px rgba(120,230,160,.28);',
        knob: v ? 'left: 19px; background: ' + acc + ';' : 'left: 3px; background: #8aa398;'
      };
    };
    return {
      accent: acc,
      onClass: on ? 'on' : '',
      title: on ? 'This pad is live.' : 'Set up this pad.',
      sub: on
        ? 'It is advertising on this network. Open Fileporter on another computer and the two will find each other.'
        : 'Your computers find each other on this network and prove who they are. Files travel straight between them — no cloud, no account, nothing uploaded anywhere.',
      padState: on ? 'online · advertising' : 'offline',
      dotStyle: 'width: 5px; height: 5px; border-radius: 50%; '
        + (on ? 'background: ' + acc + ';' : 'box-shadow: inset 0 0 0 1px #6f8579;'),
      toggles: [t('launch', 'Bring the pad online when I sign in'), t('notify', 'Notify me when something arrives')],
      cta: on ? 'Pad is live' : 'Bring this pad online',
      ctaStyle: 'padding: 12px 0; border-radius: 999px; font-size: 14px; font-weight: 500; letter-spacing: .01em; '
        + (on ? 'color: #8aa398; box-shadow: inset 0 0 0 1px rgba(120,230,160,.3);'
              : 'color: #071008; background: ' + acc + ';'),
      ctaNote: on
        ? 'You can rename it or change the folder any time in Config.'
        : 'macOS asks for local-network access; Windows asks for the firewall on Private networks.',
      engage: () => this.setState({ online: !this.state.online })
    };
  }
}
</script>
</body>
</html>
