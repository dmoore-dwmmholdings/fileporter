[package]
name = "fileporter-identity"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Pure Fileporter device identity and pairing transcript cryptography"
license = "MIT OR Apache-2.0"

[dependencies]
blake3 = "1"
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"
