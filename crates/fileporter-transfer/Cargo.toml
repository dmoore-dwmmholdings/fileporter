[package]
name = "fileporter-transfer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Filesystem-safe manifest and receiver path policy for Fileporter"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
filetime = "0.2"

[dev-dependencies]
tempfile = "3"
