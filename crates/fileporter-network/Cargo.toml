[package]
name = "fileporter-network"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Authenticated direct TCP/TLS sessions for Fileporter"
license = "MIT OR Apache-2.0"

[dependencies]
blake3 = "1"
fileporter-identity = { path = "../fileporter-identity" }
fileporter-protocol = { path = "../fileporter-protocol" }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["io-util", "net", "time", "rt", "macros"] }
tokio-rustls = "0.26"
x509-parser = "0.16"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "time", "rt", "macros"] }

[lints.rust]
unsafe_code = "forbid"
