name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # Keep the auditing binary reproducible rather than relying on a runner image.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0 --locked
      - name: Audit Rust lockfiles
        run: |
          cargo audit --deny warnings --file crates/fileporter-protocol/Cargo.lock
          cargo audit --deny warnings --file crates/fileporter-identity/Cargo.lock
          cargo audit --deny warnings --file crates/fileporter-network/Cargo.lock
          cargo audit --deny warnings --file crates/fileporter-transfer/Cargo.lock
          cargo audit --deny warnings --file src-tauri/Cargo.lock
      - run: pnpm install --frozen-lockfile
      # Policy: audit all locked frontend dependencies and fail on high or critical advisories.
      - name: Audit frontend dependencies
        run: pnpm audit --audit-level=high

  third-party-notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Verify locked dependency notice manifest
        run: pnpm licenses:check
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: THIRD_PARTY_MANIFEST.json
          retention-days: 14

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        shell: bash
        run: |
          cargo fmt --manifest-path crates/fileporter-protocol/Cargo.toml -- --check
          cargo fmt --manifest-path crates/fileporter-identity/Cargo.toml -- --check
          cargo fmt --manifest-path crates/fileporter-network/Cargo.toml -- --check
          cargo fmt --manifest-path crates/fileporter-transfer/Cargo.toml -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy core crates
        shell: bash
        run: |
          cargo clippy --manifest-path crates/fileporter-protocol/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/fileporter-identity/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/fileporter-network/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/fileporter-transfer/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --lib --no-default-features -- -D warnings
      - name: Core tests
        shell: bash
        run: |
          cargo test --manifest-path crates/fileporter-protocol/Cargo.toml
          cargo test --manifest-path crates/fileporter-identity/Cargo.toml
          cargo test --manifest-path crates/fileporter-network/Cargo.toml
          cargo test --manifest-path crates/fileporter-transfer/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --lib --no-default-features
      - name: Desktop shell check
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml --features desktop

  unsigned-bundles:
    name: Unsigned bundles (${{ matrix.os }})
    needs: [frontend, rust, third-party-notices]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: fileporter-windows-unsigned
            artifact_path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            artifact_name: fileporter-macos-unsigned
            artifact_path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      # No credentials are supplied: these are development/CI artifacts only.
      - name: Build unsigned Tauri bundles
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
